<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>PureScript demo</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <nav class="route-nav" aria-label="Demo pages">
      <a class="route-link" href="/svg" data-page="/svg" data-route="/svg">SVG</a>
      <a class="route-link" href="/canvas" data-page="/canvas" data-route="/canvas">Canvas</a>
      <a class="route-link" href="/purescript-drawing" data-page="/purescript-drawing" data-route="/purescript-drawing">PureScript Drawing</a>
    </nav>
    <main class="demo-page">
      <aside class="action-bar" data-page-actions aria-label="Drawing actions">
        <button id="step-algorithm" type="button">Step algorithm</button>
      </aside>
      <section class="demo-stage" data-demo-page="/svg" hidden>
        <svg id="svg-target" class="demo-square" role="img" aria-label="Drawing demo"></svg>
      </section>
      <section class="demo-stage" data-demo-page="/canvas" hidden>
        <canvas
          id="canvas-target"
          class="demo-square"
          width="240"
          height="240"
          role="img"
          aria-label="Drawing demo"
        ></canvas>
      </section>
      <section class="demo-stage" data-demo-page="/purescript-drawing" hidden>
        <canvas
          id="drawing-target"
          class="demo-square"
          width="240"
          height="240"
          role="img"
          aria-label="Drawing demo"
        ></canvas>
      </section>
    </main>
  </body>
</html>
