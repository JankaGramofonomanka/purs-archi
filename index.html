<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>PureScript demo</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <nav class="route-nav" aria-label="Demo pages">
      <a class="route-link" href="/algo/svg" data-page="/svg" data-route="/algo/svg">SVG</a>
      <a class="route-link" href="/algo/canvas" data-page="/canvas" data-route="/algo/canvas">Canvas</a>
      <a class="route-link" href="/algo/purescript-drawing" data-page="/purescript-drawing" data-route="/algo/purescript-drawing">PureScript Drawing</a>
    </nav>
    <main class="demo-page">
      <aside class="action-bar" data-page-actions="/algo" aria-label="Drawing actions" hidden>
        <button id="step-algorithm" type="button">Step algorithm</button>
      </aside>
      <aside class="action-bar" data-page-actions="/collonade" aria-label="Collonade settings" hidden>
        <fieldset class="action-group">
          <legend>Proportions after</legend>
          <div id="collonade-treatises" class="treatise-switch"></div>
        </fieldset>
        <fieldset class="action-group">
          <legend>Orders, bottom to top</legend>
          <ol id="collonade-orders" class="order-list"></ol>
          <button id="collonade-add-order" type="button">Add order</button>
        </fieldset>
        <label class="action-group">
          <span>Bay width, in diameters</span>
          <input id="collonade-bay-width" type="number" step="0.25" inputmode="decimal" />
        </label>
        <label class="action-group">
          <span>Window width, in diameters</span>
          <input id="collonade-window-width" type="number" step="0.25" inputmode="decimal" />
        </label>
        <fieldset class="action-group">
          <legend>Bay width measured</legend>
          <button id="collonade-bay-measure" type="button"></button>
        </fieldset>
        <fieldset class="action-group">
          <legend>Arcade options</legend>
          <div id="collonade-arcade-modes" class="treatise-switch"></div>
        </fieldset>
      </aside>
      <aside class="action-bar bottom-bar" data-page-actions="/collonade" aria-label="Collonade rythm" hidden>
        <div class="sequencer">
          <div class="sequencer-labels">
            <span class="bottom-bar-label">Columns per axis</span>
            <span class="bottom-bar-label">Bays between axes</span>
          </div>
          <button id="collonade-add-column-left" class="add-column" type="button" aria-label="Add axis to the left"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 3h2v6h6v2h-6v6H9v-6H3V9h6z"/></svg></button>
          <div class="sequencer-rows">
            <ol id="collonade-beats" class="beat-list" aria-label="Axes, left to right"></ol>
            <ol id="collonade-bays" class="beat-list bay-list" aria-label="Bays, left to right"></ol>
          </div>
          <div class="sequencer-counts">
            <span id="collonade-column-count" class="column-count" aria-live="polite"></span>
            <span id="collonade-bay-count" class="column-count" aria-live="polite"></span>
          </div>
          <button id="collonade-add-column" class="add-column" type="button" aria-label="Add axis to the right"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M9 3h2v6h6v2h-6v6H9v-6H3V9h6z"/></svg></button>
          <div class="sequencer-actions">
            <span class="sequencer-actions-title">Repeat or mirror</span>
            <div class="sequencer-action-row">
              <button id="collonade-repeat-beats" class="repeat-selection" type="button">Repeat</button>
              <button id="collonade-mirror-beats-right" class="mirror mirror-right" type="button" aria-label="Mirror the left half of the axes onto the right half"><svg viewBox="0 0 24 20" aria-hidden="true"><path d="M2 5h3v11H2zM6.5 9h3v7h-3z"/><path d="M12 2v16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.5"/><path d="M14 9h5V6l4 4-4 4v-3h-5z"/></svg></button>
              <button id="collonade-mirror-beats-left" class="mirror mirror-left" type="button" aria-label="Mirror the right half of the axes onto the left half"><svg viewBox="0 0 24 20" aria-hidden="true"><path d="M2 5h3v11H2zM6.5 9h3v7h-3z"/><path d="M12 2v16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.5"/><path d="M14 9h5V6l4 4-4 4v-3h-5z"/></svg></button>
            </div>
            <div class="sequencer-action-row">
              <button id="collonade-repeat-bays" class="repeat-selection" type="button">Repeat</button>
              <button id="collonade-mirror-bays-right" class="mirror mirror-right" type="button" aria-label="Mirror the left half of the bays onto the right half"><svg viewBox="0 0 24 20" aria-hidden="true"><path d="M2 5h3v11H2zM6.5 9h3v7h-3z"/><path d="M12 2v16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.5"/><path d="M14 9h5V6l4 4-4 4v-3h-5z"/></svg></button>
              <button id="collonade-mirror-bays-left" class="mirror mirror-left" type="button" aria-label="Mirror the right half of the bays onto the left half"><svg viewBox="0 0 24 20" aria-hidden="true"><path d="M2 5h3v11H2zM6.5 9h3v7h-3z"/><path d="M12 2v16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.5"/><path d="M14 9h5V6l4 4-4 4v-3h-5z"/></svg></button>
            </div>
          </div>
        </div>
      </aside>
      <div class="zoom-controls" data-page-actions="/collonade" role="group" aria-label="Drawing size" hidden>
        <button id="collonade-zoom-in" type="button" aria-label="Enlarge drawing" title="Enlarge drawing">+</button>
        <button id="collonade-zoom-out" type="button" aria-label="Shrink drawing" title="Shrink drawing">&minus;</button>
      </div>
      <section class="demo-stage" data-demo-page="/svg" hidden>
        <svg id="svg-target" class="demo-square" role="img" aria-label="Drawing demo"></svg>
      </section>
      <section class="demo-stage" data-demo-page="/canvas" hidden>
        <canvas
          id="canvas-target"
          class="demo-square"
          width="240"
          height="240"
          role="img"
          aria-label="Drawing demo"
        ></canvas>
      </section>
      <section class="demo-stage" data-demo-page="/purescript-drawing" hidden>
        <canvas
          id="drawing-target"
          class="demo-square"
          width="240"
          height="240"
          role="img"
          aria-label="Drawing demo"
        ></canvas>
      </section>
    </main>
  </body>
</html>
