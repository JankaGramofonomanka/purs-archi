<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>PureScript demo</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <nav class="route-nav" aria-label="Demo pages">
      <a class="route-link" href="/svg" data-route="/svg">SVG</a>
      <a class="route-link" href="/canvas" data-route="/canvas">Canvas</a>
      <a class="route-link" href="/purescript-drawing" data-route="/purescript-drawing">PureScript Drawing</a>
    </nav>
    <main id="home-page" class="demo-card">
      <p class="eyebrow">A tiny PureScript app</p>
      <h1>Hello from PureScript</h1>
      <p class="description">
        This page is served on localhost, and the counter logic is compiled
        from PureScript.
      </p>
      <div class="counter" aria-live="polite">
        <span id="count">0</span>
      </div>
      <button id="increment" type="button">Increment counter</button>
    </main>
    <main id="demo-page" class="demo-page" hidden>
      <p id="route-label-demo" class="route-label" hidden></p>
      <section class="demo-stage" data-demo-page="/svg" hidden>
        <div id="svg-target" class="demo-square"></div>
      </section>
      <section class="demo-stage" data-demo-page="/canvas" hidden>
        <canvas
          id="canvas-target"
          class="demo-square"
          width="240"
          height="240"
          role="img"
          aria-label="Adjacent blue and red squares drawn with the Canvas API"
        ></canvas>
      </section>
      <section class="demo-stage" data-demo-page="/purescript-drawing" hidden>
        <canvas
          id="drawing-target"
          class="demo-square"
          width="240"
          height="240"
          role="img"
          aria-label="Adjacent blue and red squares drawn with PureScript Drawing"
        ></canvas>
      </section>
    </main>
  </body>
</html>
